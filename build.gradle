plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.107'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    // Add here additional repositories if required by some of the dependencies below.
    maven {
        name = "TerraformersMC"
        url = uri("https://maven.terraformersmc.com/")
    }
    maven {
        name = 'cursemaven'
        url = uri("https://curse.cleanroommc.com")
    }
    maven {
        name = "Modmaven"
        url = uri("https://modmaven.dev/")
    }
    maven {
        url = uri("https://maven.shedaniel.me/")
    }
    maven {
        url = uri("https://maven.architectury.dev/")
    }
    maven {
        url = uri("https://maven.latvian.dev/releases/")
    }
    maven {
        name = "Modrinth"
        url = uri("https://api.modrinth.com/maven")
    }
    mavenCentral()
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            jvmArguments.addAll '-Xmx3G', '-Xms3G'
        }

        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            jvmArguments.addAll '-Xmx3G', '-Xms3G'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // --- Added dependencies for target mods ---
    implementation "curse.maven:glodium-957920:${glodium_version_id}"
    implementation "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    implementation "org.appliedenergistics:guideme:${guideme_version}"
    implementation "curse.maven:curios-309927:${curios_version_id}"

    compileOnly "curse.maven:applied-flux-965012:${applied_flux_version_id}"
    compileOnly "dev.emi:emi-neoforge:${emi_version}"
    compileOnly "curse.maven:mega-cells-622112:${mega_cells_version_id}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
    compileOnly "mekanism:Mekanism:${mekanism_api_version}"
    compileOnly "curse.maven:applied-mekanistics-574300:${applied_mekanistics_version_id}"
    compileOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    compileOnly "dev.latvian.mods:rhino:${rhino_version}"
    compileOnly "curse.maven:framedblocks-441647:${framedblocks_version_id}"
    compileOnly "curse.maven:advancedae-1084104:${advancedae_compile_version_id}"
    compileOnly "curse.maven:functional-storage-556861:${functional_storage_version_id}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
    compileOnly "curse.maven:ae2-jei-integration-1074338:${ae2_jei_integration_version_id}"

    // runtime test
    runtimeOnly "curse.maven:applied-flux-965012:${applied_flux_version_id}"
    compileOnly "de.mari_023:ae2wtlib_api:${ae2wtlib_api_version}"
    runtimeOnly "de.mari_023:ae2wtlib:${ae2wtlib_version}"
    runtimeOnly "curse.maven:mega-cells-622112:${mega_cells_version_id}"

    runtimeOnly "curse.maven:mekanism-268560:${mekanism_version_id}"
    runtimeOnly "curse.maven:applied-mekanistics-574300:${applied_mekanistics_version_id}"


    implementation "curse.maven:jade-324717:${jade_version_id}"

    //eae
    implementation "curse.maven:ex-pattern-provider-892005:${ex_pattern_provider_version_id}"

    //aea
//    compileOnly "curse.maven:advancedae-1084104:${advancedae_version_id}"
    implementation "curse.maven:advancedae-1084104:${advancedae_version_id}"

    //geckolib
    runtimeOnly "curse.maven:geckolib-388172:${geckolib_version_id}"

    // eco
    implementation "curse.maven:neo-eco-ae-extension-1460639:${neo_eco_ae_extension_version_id}"
    implementation "maven.modrinth:ldlib:${ldlib_version}"

    //ftbteams：compat 层直接引用 FTB Teams API，编译期需要 ftbteams + ftb-library + architectury（最低 2101.1.0）
    compileOnly "curse.maven:ftb-teams-forge-404468:${ftb_teams_version_id}"
    compileOnly "curse.maven:ftb-library-forge-404465:${ftb_library_version_id}"
    compileOnly "curse.maven:architectury-api-419699:${architectury_api_version_id}"
    runtimeOnly "curse.maven:ftb-teams-forge-404468:${ftb_teams_version_id}"
    runtimeOnly "curse.maven:ftb-library-forge-404465:${ftb_library_version_id}"
    runtimeOnly "curse.maven:architectury-api-419699:${architectury_api_version_id}"

    //jecharacters（拼音搜索）：compat 层直接引用 me.towdium.jecharacters.utils.Match，编译期需要 JEC
    //最低版本 4.5.24（1.21.1 线首版）由 src/main/templates/META-INF/neoforge.mods.toml 的 versionRange 声明，不在此重复
    compileOnly fileTree(dir: 'libs', includes: ['jecharacters-*.jar'])

    //biggerae2
   // runtimeOnly "curse.maven:bigger-ae2-1013772:6587078"

    //obs性能监测
    implementation "curse.maven:observable-509575:${observable_version_id}"
    implementation "curse.maven:kotlin-for-forge-351264:${kotlin_for_forge_version_id}"

    //建筑棒
    implementation "curse.maven:construction-sticks-1156098:${construction_sticks_version_id}"

    runtimeOnly fileTree(dir: 'libs', includes: ['*.jar'])

    // setup Xei (EMI/REI/JEI) using project property 'use_Xei'
    switch (project.findProperty('use_Xei') ?: 'emi') {
        case 'emi':
            runtimeOnly "dev.emi:emi-neoforge:${emi_version}"
            break
        case 'emi_jei':
            // EMI + JEI 同时加载：EAEP 两套集成并行（输入交互走 EMI 路径，JEI 分类/书签照常）
            runtimeOnly "dev.emi:emi-neoforge:${emi_version}"
            runtimeOnly "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
            runtimeOnly "curse.maven:ae2-jei-integration-1074338:${ae2_jei_integration_version_id}"
            break
        case 'rei':
            runtimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
            runtimeOnly "dev.architectury:architectury-neoforge:${architectury_neoforge_version}"
            runtimeOnly "curse.maven:cloth-config-348521:${cloth_config_version_id}"
            break
        case 'jei':
            runtimeOnly "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
            runtimeOnly "curse.maven:ae2-jei-integration-1074338:${ae2_jei_integration_version_id}"
            break
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
